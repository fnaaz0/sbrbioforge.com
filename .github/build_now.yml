name: Manual Build APK and AAB

on:
  workflow_dispatch:  # इससे आप खुद बटन दबाकर जब चाहें ऐप बना सकते हैं

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Build AAB
        run: flutter build appbundle --debug

      - name: Save APK File
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Save AAB File
        uses: actions/upload-artifact@v4
        with:
          name: my-app-aab
          path: build/app/outputs/bundle/debug/app-debug.aab
          
